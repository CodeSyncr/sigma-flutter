name: sigma
description: Sigma's native spreadsheet editor in Flutter apps, through the Sigma iOS and Android SDKs. Formulas, formatting, charts, Vani AI and saving; your server mints the links.
version: 1.0.0
homepage: https://nimbusgo.space/cloud/docs/sigma
repository: https://github.com/CodeSyncr/sigma-flutter
issue_tracker: https://github.com/CodeSyncr/sigma-flutter/issues
topics: [spreadsheet, excel, editor, sheets]

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The native SDKs each platform builds on (sigma-android on JitPack, NimbusSigma on GitHub).
sigma:
  androidSdkVersion: 1.0.2
  iosSdkVersion: 2.1.1

flutter:
  plugin:
    platforms:
      android:
        package: com.codesyncr.sigma.flutter
        pluginClass: SigmaFlutterPlugin
      ios:
        pluginClass: SigmaFlutterPlugin
